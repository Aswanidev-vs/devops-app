name: devops-app

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    networks: [app-net]
    volumes:
      - app-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    image: devpos/devops-app:1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [app-net]
    env_file: app.env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  app-net:
    name: app-net

volumes:
  app-data:
    name: app-data